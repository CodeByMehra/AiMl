<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Summarizer</title>
    <style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body{
        background: #f4f6f9;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
    }

    .container{
        width: 100%;
        max-width: 800px;
        background: #fff;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1{
        text-align: center;
        color: #333;
        margin-bottom: 10px;
    }

    h3{
        text-align: center;
        color: #666;
        margin-bottom: 20px;
    }

    textarea{
        width: 100%;
        min-height: 200px;
        padding: 15px;
        border: 1px solid #ccc;
        border-radius: 8px;
        resize: vertical;
        font-size: 16px;
        outline: none;
        margin-bottom: 15px;
    }

    textarea:focus{
        border-color: #4f46e5;
    }

    button{
        width: 100%;
        padding: 12px;
        background: #4f46e5;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover{
        background: #4338ca;
    }

    form p{
        text-align: center;
        color: #777;
        margin-top: 10px;
    }

    .summaryOutput{
        margin-top: 25px;
        padding: 20px;
        background: #f8fafc;
        border-left: 5px solid #4f46e5;
        border-radius: 8px;
    }

    #SummaryHeading{
        text-align: left;
        color: #333;
        margin-bottom: 10px;
    }

    #SummaryText{
        color: #555;
        line-height: 1.6;
    }
</style>
</head>
<body>
    <div class="container">
        <h1>Text Summarizer</h1>
        <h3>Using HuggingFace Transformer</h3>

        <form id="SummarizationForm">
            <textarea id="DialogueInput" placeholder="Enter Content Here" required></textarea>
            <button type="submit">Summarize</button>
            <p>Enter or Paste Your Content to summarize</p>
        </form>

        <div class="summaryOutput">
            <h3 id="SummaryHeading">Content Summary</h3>
            <p id="SummaryText"></p>
        </div>
    </div>
    <script>
document.getElementById("SummarizationForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    // Get elements
    const dialogueInput = document.getElementById("DialogueInput");
    const summaryText = document.getElementById("SummaryText");
    const submitButton = e.target.querySelector("button");

    const dialogue = dialogueInput.value.trim();

    if (!dialogue) {
        summaryText.innerText = "Please enter some content.";
        return;
    }

    // Show loading message
    summaryText.innerText = "Processing...";
    submitButton.disabled = true;
    submitButton.innerText = "Summarizing...";

    try {
        const response = await fetch("/summarize/", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                dialogue: dialogue
            })
        });

        if (!response.ok) {
            throw new Error(`Server Error: ${response.status}`);
        }

        const data = await response.json();

        summaryText.innerText =
            data.summary || "No summary returned.";

    } catch (error) {
        summaryText.innerText =
            `Error: ${error.message}`;
    } finally {
        submitButton.disabled = false;
        submitButton.innerText = "Summarize";
    }
});
</script>
</body>
</html>
